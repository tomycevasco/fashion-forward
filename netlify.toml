# ============================================================
# FASHION FORWARD — configuración de Netlify
# Sitio 100% estático: no hay build step, se publica la raíz tal cual.
# ============================================================

[build]
  publish = "."
  command = ""

# Las carpetas que empiezan con _ son de trabajo (fuente del catálogo y
# scripts), no hace falta que Netlify las sirva.
[build.processing]
  skip_processing = false

# --- headers ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/data/products.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# --- redirects de cortesía ---
[[redirects]]
  from = "/liu-jo/*"
  to = "/liujo/:splat"
  status = 301

[[redirects]]
  from = "/carrito"
  to = "/carrito/"
  status = 301
